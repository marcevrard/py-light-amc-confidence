# Pandoc defaults shared by all quizzes. Use the Makefile:  make QUIZ=examples/simple
# (the quiz-specific files -- meta.tex and questions.md -- are added by the Makefile)
metadata:
  pagetitle: "Quiz"
  lang: en
variables:
  documentclass: article
  classoption: [a4paper, 11pt]
  geometry: [margin=2cm]
include-in-header:
  - template/style.tex
  - template/answer-sheet.tex
include-after-body:
  - template/answer-page.tex
pdf-engine: pdflatex
